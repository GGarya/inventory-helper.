<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6fa"><title>Учёт заработка</title>
<style>
:root{color-scheme:light;--bg:#f5f6fa;--card:#fff;--text:#171923;--muted:#777d8c;--line:#e8eaf0;--accent:#2864e8;--green:#13865b;--red:#d34b4b;--input:#fff;--soft:#eef2ff;--soft-text:#2856b8;--mini:#f1f3f7;--mini-text:#50596a}
:root[data-theme="dark"]{color-scheme:dark;--bg:#10141d;--card:#1b2230;--text:#edf1f8;--muted:#a1aabc;--line:#30394a;--accent:#5b8cff;--input:#151b27;--soft:#27334b;--soft-text:#c6d6ff;--mini:#2b3445;--mini-text:#d4dbea}
body{transition:background .2s,color .2s}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 14px calc(22px + env(safe-area-inset-bottom))}
.wrap{max-width:680px;margin:0 auto}.top{padding:22px 2px 16px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.top-copy{min-width:0}.theme-toggle{flex:0 0 auto;min-height:40px;padding:0 12px;background:var(--soft);color:var(--soft-text);border:1px solid var(--line);border-radius:12px;font-size:13px}.top h1{font-size:25px;letter-spacing:-.6px;margin:0 0 5px}.top p{margin:0;color:var(--muted);font-size:14px}
.summary{background:#17243d;color:white;border-radius:20px;padding:19px 20px;margin-bottom:14px;box-shadow:0 8px 24px #17243d18}.summary small{color:#c3ccdc;font-size:13px}.sumline{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-top:5px}.sum{font-size:32px;font-weight:750;letter-spacing:-1px}.count{font-size:13px;color:#c3ccdc;text-align:right;padding-bottom:5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;margin-bottom:14px;box-shadow:0 3px 12px #17243d08}.card h2{font-size:17px;margin:0 0 14px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{min-width:0}.field.full{grid-column:1/-1}label{display:block;color:var(--muted);font-size:13px;margin:0 0 7px}input{width:100%;height:48px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font:inherit;color:var(--text);background:var(--input);outline:none}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #2864e81a}input[type=number]{font-variant-numeric:tabular-nums}button{border:0;border-radius:12px;min-height:47px;padding:0 16px;font:600 15px inherit;cursor:pointer}.primary{background:var(--accent);color:white;width:100%;margin-top:14px}.secondary{background:var(--soft);color:var(--soft-text)}.cancel{background:var(--mini);color:var(--mini-text)}.actions{display:flex;gap:9px}.actions button{flex:1}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.toolbar h2{margin:0;font-size:18px}.filter{width:auto;height:39px;font-size:13px;padding:0 9px;border-radius:10px}.entry{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line)}.entry:first-child{border-top:0}.entry-main{min-width:0;flex:1}.order{font-weight:650;font-size:15px;overflow-wrap:anywhere}.date{font-size:13px;color:var(--muted);margin-top:4px}.amount{font-weight:700;font-size:16px;white-space:nowrap;font-variant-numeric:tabular-nums}.entry-buttons{display:flex;gap:5px;margin-left:2px}.mini{min-height:34px;width:34px;padding:0;background:var(--mini);color:var(--mini-text);font-size:15px}.mini.del{color:var(--red)}.empty{text-align:center;color:var(--muted);padding:24px 8px;font-size:14px}.foot{font-size:12px;color:var(--muted);text-align:center;padding:4px 0 10px}
@media(max-width:390px){body{padding-left:10px;padding-right:10px}.card{padding:14px}.sum{font-size:29px}.entry{gap:8px}.entry-buttons{gap:3px}.mini{width:31px}}
</style></head>
<body><main class="wrap">
<header class="top"><div class="top-copy"><h1>Учёт заработка</h1><p>Записывай оплату за каждую выполненную заявку</p></div><button class="theme-toggle" id="themeToggle" type="button" aria-label="Переключить тему">🌙 Ночной режим</button></header>
<section class="summary"><small>Всего заработано</small><div class="sumline"><div class="sum" id="total">0 ₽</div><div class="count" id="count">0 заявок</div></div></section>
<section class="card"><h2 id="formTitle">Добавить заявку</h2><form id="entryForm"><div class="fields">
<div class="field"><label for="date">Дата</label><input id="date" type="date" required></div>
<div class="field"><label for="order">Номер заявки</label><input id="order" type="text" placeholder="Например, 12548" required autocomplete="off" autocapitalize="characters" maxlength="24"></div>
<div class="field full"><label for="amount">Сумма, ₽</label><input id="amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="Например, 850" required></div>
</div><div class="actions"><button class="primary" id="saveBtn" type="submit">Добавить в список</button><button class="cancel" id="cancelBtn" type="button" hidden>Отмена</button></div></form></section>
<section class="card"><div class="toolbar"><h2>История заявок</h2><select class="filter" id="period" aria-label="Период"><option value="all">За всё время</option><option value="month">Этот месяц</option><option value="year">Этот год</option></select></div><div id="entries"><div class="empty">Пока нет записей. Добавь первую заявку выше.</div></div></section>
<div class="foot">Данные сохраняются автоматически на этом устройстве</div>
</main>
<script>
const KEY='piecework_earnings_v1',THEME_KEY='piecework_theme_v1';let records=[];let editingId=null;
const $=id=>document.getElementById(id);const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
function load(){try{records=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(records))records=[];records=records.map(r=>({...r,order:String(r.order||'').trim()}))}catch{records=[]}}
function withPrefix(value){return String(value||'').trim()}
function applyTheme(theme){document.documentElement.dataset.theme=theme;$('themeToggle').textContent=theme==='dark'?'☀️ Дневной режим':'🌙 Ночной режим';$('themeToggle').setAttribute('aria-label',theme==='dark'?'Включить дневную тему':'Включить ночную тему');document.querySelector('meta[name="theme-color"]').content=theme==='dark'?'#10141d':'#f5f6fa';localStorage.setItem(THEME_KEY,theme)}
function persist(){localStorage.setItem(KEY,JSON.stringify(records))}
function money(n){return new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(n)+' ₽'}
function dateText(s){if(!s)return '';const [y,m,d]=s.split('-');return `${d}.${m}.${y}`}
function filtered(){const p=$('period').value,now=new Date();return records.filter(r=>{const d=new Date(r.date+'T12:00:00');return p==='all'||(p==='month'&&d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear())||(p==='year'&&d.getFullYear()===now.getFullYear())}).sort((a,b)=>b.date.localeCompare(a.date)||b.created-b.created)}
function render(){const list=filtered();const sum=list.reduce((s,r)=>s+Number(r.amount),0);$('total').textContent=money(sum);$('count').textContent=`${list.length} ${list.length===1?'заявка':list.length>=2&&list.length<=4?'заявки':'заявок'}`;const host=$('entries');host.innerHTML='';if(!list.length){host.innerHTML='<div class="empty">За выбранный период записей нет.</div>';return}list.forEach(r=>{const el=document.createElement('div');el.className='entry';const main=document.createElement('div');main.className='entry-main';const order=document.createElement('div');order.className='order';order.textContent='Заявка № '+r.order;const date=document.createElement('div');date.className='date';date.textContent=dateText(r.date);main.append(order,date);const amount=document.createElement('div');amount.className='amount';amount.textContent=money(Number(r.amount));const controls=document.createElement('div');controls.className='entry-buttons';const edit=document.createElement('button');edit.className='mini';edit.type='button';edit.textContent='✎';edit.setAttribute('aria-label','Изменить');edit.onclick=()=>editRecord(r.id);const del=document.createElement('button');del.className='mini del';del.type='button';del.textContent='×';del.setAttribute('aria-label','Удалить');del.onclick=()=>deleteRecord(r.id);controls.append(edit,del);el.append(main,amount,controls);host.append(el)})}
function resetForm(){editingId=null;$('entryForm').reset();$('date').value=today();$('formTitle').textContent='Добавить заявку';$('saveBtn').textContent='Добавить в список';$('cancelBtn').hidden=true}
function editRecord(id){const r=records.find(x=>x.id===id);if(!r)return;editingId=id;$('date').value=r.date;$('order').value=r.order;$('amount').value=r.amount;$('formTitle').textContent='Изменить заявку';$('saveBtn').textContent='Сохранить изменения';$('cancelBtn').hidden=false;window.scrollTo({top:0,behavior:'smooth'})}
function deleteRecord(id){if(!confirm('Удалить эту заявку?'))return;records=records.filter(r=>r.id!==id);persist();if(editingId===id)resetForm();render()}
$('entryForm').addEventListener('submit',e=>{e.preventDefault();const amount=Number($('amount').value);if(!Number.isFinite(amount)||amount<=0){alert('Укажи сумму больше нуля.');return}const data={date:$('date').value,order:$('order').value.trim(),amount};if(!data.date||!data.order)return;if(editingId){records=records.map(r=>r.id===editingId?{...r,...data}:r)}else{records.push({id:String(Date.now())+Math.random().toString(16).slice(2),...data,created:Date.now()})}persist();resetForm();render()});

$('cancelBtn').onclick=resetForm;$('period').onchange=render;$('themeToggle').onclick=()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');load();$('date').value=today();applyTheme(localStorage.getItem(THEME_KEY)||'light');render();
</script></body></html>
